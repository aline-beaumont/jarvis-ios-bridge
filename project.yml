name: JarvisBridge
options:
  bundleIdPrefix: dev.visionclaw
  deploymentTarget:
    iOS: "16.0"

targets:
  JarvisBridge:
    type: application
    platform: iOS
    sources:
      - path: JarvisBridge/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visionclaw.jarvis-bridge
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: JarvisBridge/Info.plist
      properties:
        CFBundleName: JARVIS Bridge
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: JARVIS needs microphone access to listen for the wake word and record your voice commands.
        NSBluetoothAlwaysUsageDescription: JARVIS needs Bluetooth to connect to your smart glasses for audio input and output.
        NSBluetoothPeripheralUsageDescription: JARVIS needs Bluetooth to connect to your smart glasses.
        NSLocalNetworkUsageDescription: JARVIS needs local network access to communicate with the Mac mini server.
        NSHealthShareUsageDescription: JARVIS reads your health data (heart rate, blood oxygen, steps, sleep, HRV) from Apple Watch to provide personalized insights.
        UIBackgroundModes:
          - audio
          - bluetooth-central
    entitlements:
      path: JarvisBridge/JarvisBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
